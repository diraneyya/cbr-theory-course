<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#1a1a1a"/>
<text x="640.0" y="60" font-size="40" fill="#f5f5f5" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">The week in numbers — if you hold these, you hold the exam</text>
<rect x="55" y="160" width="360" height="140" rx="14" fill="#262626" stroke="#444" stroke-width="2"/>
<text x="235" y="222" font-size="26" fill="#ffb454" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">50 / 80 / 100 / 130</text>
<text x="235" y="258" font-size="20" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">the speed ladder (100</text>
<text x="235" y="284" font-size="20" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">by day on the motorway)</text>
<rect x="460" y="160" width="360" height="140" rx="14" fill="#262626" stroke="#444" stroke-width="2"/>
<text x="640" y="222" font-size="34" fill="#ffb454" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">90</text>
<text x="640" y="258" font-size="20" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">your ceiling with a</text>
<text x="640" y="284" font-size="20" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">trailer — lowest number wins</text>
<rect x="865" y="160" width="360" height="140" rx="14" fill="#262626" stroke="#444" stroke-width="2"/>
<text x="1045" y="222" font-size="34" fill="#ffb454" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">30</text>
<text x="1045" y="258" font-size="20" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">the zone — holds</text>
<text x="1045" y="284" font-size="20" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">until the end-zone sign</text>
<rect x="55" y="330" width="360" height="140" rx="14" fill="#262626" stroke="#444" stroke-width="2"/>
<text x="235" y="392" font-size="34" fill="#ffb454" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">0.2‰</text>
<text x="235" y="428" font-size="20" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">your alcohol limit as</text>
<text x="235" y="454" font-size="20" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">a novice (0.5‰ later)</text>
<rect x="460" y="330" width="360" height="140" rx="14" fill="#262626" stroke="#444" stroke-width="2"/>
<text x="640" y="392" font-size="34" fill="#ffb454" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">50 m</text>
<text x="640" y="428" font-size="20" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">rear fog light</text>
<text x="640" y="454" font-size="20" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">only below this visibility</text>
<rect x="865" y="330" width="360" height="140" rx="14" fill="#262626" stroke="#444" stroke-width="2"/>
<text x="1045" y="392" font-size="34" fill="#ffb454" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">5 m</text>
<text x="1045" y="428" font-size="20" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">no parking near</text>
<text x="1045" y="454" font-size="20" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">junctions and zebras</text>
<rect x="55" y="500" width="360" height="140" rx="14" fill="#262626" stroke="#444" stroke-width="2"/>
<text x="235" y="562" font-size="34" fill="#ffb454" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">1.35 m</text>
<text x="235" y="598" font-size="20" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">shorter child → child</text>
<text x="235" y="624" font-size="20" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">seat, not just a belt</text>
<rect x="460" y="500" width="360" height="140" rx="14" fill="#262626" stroke="#444" stroke-width="2"/>
<text x="640" y="562" font-size="34" fill="#ffb454" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">1.6 mm</text>
<text x="640" y="598" font-size="20" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">minimum tyre tread</text>
<rect x="865" y="500" width="360" height="140" rx="14" fill="#262626" stroke="#444" stroke-width="2"/>
<text x="1045" y="562" font-size="34" fill="#ffb454" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">walking pace</text>
<text x="1045" y="598" font-size="20" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">in the erf — and</text>
<text x="1045" y="624" font-size="20" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">yield to all when leaving</text>
<text x="640.0" y="690" font-size="26" fill="#aaaaaa" text-anchor="middle" font-family="Helvetica,Arial">Monday 24 August, 09:00 — Amsterdam Sloterdijk — reservation 6545 — bring your ID</text>
</svg>