<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#1a1a1a"/>
<text x="640.0" y="54" font-size="38" fill="#f5f5f5" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">Where parking is forbidden even without any sign</text>
<text x="640.0" y="110" font-size="26" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">also forbidden: on a cycle path or cycle lane · at a bus stop · on the pavement</text>
<text x="640.0" y="148" font-size="24" fill="#aaaaaa" text-anchor="middle" font-family="Helvetica,Arial">yellow dashed kerb line = no parking · yellow solid = no stopping</text>
<rect x="0" y="330" width="1280" height="170" fill="#333"/>
<rect x="180" y="190" width="150" height="140" fill="#333"/>
<rect x="730" y="338" width="18" height="154" fill="#e8e8e8"/>
<rect x="760" y="338" width="18" height="154" fill="#e8e8e8"/>
<rect x="790" y="338" width="18" height="154" fill="#e8e8e8"/>
<rect x="820" y="338" width="18" height="154" fill="#e8e8e8"/>
<rect x="850" y="338" width="18" height="154" fill="#e8e8e8"/>
<rect x="880" y="338" width="18" height="154" fill="#e8e8e8"/>
<rect x="1030" y="500" width="130" height="120" fill="#3d3d3d"/>
<rect x="105" y="512" width="300" height="24" fill="#c1121f"/>
<text x="255" y="582" font-size="26" fill="#ff8a8a" text-anchor="middle" font-family="Helvetica,Arial">5 m either side</text>
<text x="255" y="616" font-size="26" fill="#ff8a8a" text-anchor="middle" font-family="Helvetica,Arial">of a junction</text>
<rect x="600" y="512" width="130" height="24" fill="#c1121f"/>
<text x="640" y="582" font-size="26" fill="#ff8a8a" text-anchor="middle" font-family="Helvetica,Arial">5 m before</text>
<text x="640" y="616" font-size="26" fill="#ff8a8a" text-anchor="middle" font-family="Helvetica,Arial">a zebra</text>
<text x="1095" y="672" font-size="24" fill="#aaaaaa" text-anchor="middle" font-family="Helvetica,Arial">driveway — never block it</text>
</svg>