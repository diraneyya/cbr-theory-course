<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#1a1a1a"/>
<text x="640.0" y="56" font-size="38" fill="#f5f5f5" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">Read the street like the exam does — what could happen next?</text>
<polygon points="520,180 760,180 1050,720 230,720" fill="#333"/>
<polygon points="636,180 644,180 660,720 620,720" fill="#f5f5f5" opacity="0.55"/>
<rect x="850" y="430" width="120" height="200" rx="16" fill="#4d9de0"/>
<rect x="836" y="470" width="26" height="80" rx="6" fill="#9cc9f0"/>
<circle cx="870" cy="470" r="52" fill="none" stroke="#c1121f" stroke-width="6"/>
<text x="1050" y="470" font-size="26" fill="#ff8a8a" text-anchor="middle" font-family="Helvetica,Arial">door may open —</text>
<text x="1050" y="504" font-size="26" fill="#ff8a8a" text-anchor="middle" font-family="Helvetica,Arial">someone inside?</text>
<circle cx="430" cy="560" r="26" fill="#e0a800"/>
<path d="M 300 560 L 395 560" stroke="#e0a800" stroke-width="5" stroke-dasharray="10 8"/>
<circle cx="430" cy="560" r="58" fill="none" stroke="#c1121f" stroke-width="6"/>
<text x="240" y="640" font-size="26" fill="#ff8a8a" text-anchor="middle" font-family="Helvetica,Arial">a ball never</text>
<text x="240" y="674" font-size="26" fill="#ff8a8a" text-anchor="middle" font-family="Helvetica,Arial">crosses alone</text>
<rect x="770" y="240" width="150" height="80" rx="10" fill="#7bc96f"/>
<text x="845" y="290" font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">BUS</text>
<circle cx="770" cy="300" r="40" fill="none" stroke="#c1121f" stroke-width="5"/>
<text x="1080" y="270" font-size="26" fill="#ff8a8a" text-anchor="middle" font-family="Helvetica,Arial">pedestrians cross</text>
<text x="1080" y="304" font-size="26" fill="#ff8a8a" text-anchor="middle" font-family="Helvetica,Arial">in front of it</text>
<rect x="330" y="240" width="190" height="70" fill="#333"/>
<text x="240" y="270" font-size="26" fill="#ff8a8a" text-anchor="middle" font-family="Helvetica,Arial">side road —</text>
<text x="240" y="304" font-size="26" fill="#ff8a8a" text-anchor="middle" font-family="Helvetica,Arial">right has priority</text>
</svg>