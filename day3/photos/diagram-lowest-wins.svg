<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#1a1a1a"/>
<text x="640.0" y="66" font-size="42" fill="#f5f5f5" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">Three limits apply at once — the LOWEST wins</text>
<rect x="110" y="120" width="300" height="330" rx="18" fill="#262626" stroke="#444" stroke-width="2"/>
<text x="260" y="170" font-size="30" fill="#ffb454" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">the road type</text>
<text x="260" y="208" font-size="24" fill="#aaaaaa" text-anchor="middle" font-family="Helvetica,Arial">motorway at night</text>
<circle cx="260" cy="330" r="80" fill="#f5f5f5" stroke="#c1121f" stroke-width="18"/><text x="260" y="348.9" font-size="54" font-weight="bold" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica,Arial">130</text>
<rect x="490" y="120" width="300" height="330" rx="18" fill="#262626" stroke="#444" stroke-width="2"/>
<text x="640" y="170" font-size="30" fill="#ffb454" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">the sign</text>
<text x="640" y="208" font-size="24" fill="#aaaaaa" text-anchor="middle" font-family="Helvetica,Arial">matrix board says</text>
<circle cx="640" cy="330" r="80" fill="#f5f5f5" stroke="#c1121f" stroke-width="18"/><text x="640" y="348.9" font-size="54" font-weight="bold" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica,Arial">100</text>
<rect x="870" y="120" width="300" height="330" rx="18" fill="#262626" stroke="#444" stroke-width="2"/>
<text x="1020" y="170" font-size="30" fill="#ffb454" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">your vehicle</text>
<text x="1020" y="208" font-size="24" fill="#aaaaaa" text-anchor="middle" font-family="Helvetica,Arial">car with a trailer</text>
<circle cx="1020" cy="330" r="80" fill="#f5f5f5" stroke="#c1121f" stroke-width="18"/><text x="1020" y="348.9" font-size="54" font-weight="bold" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica,Arial">90</text>
<rect x="360.0" y="520" width="560" height="110" rx="18" fill="#0f3d1e" stroke="#2e7d32" stroke-width="3"/>
<circle cx="450.0" cy="575" r="42" fill="#f5f5f5" stroke="#c1121f" stroke-width="9"/><text x="450.0" y="585.5" font-size="30" font-weight="bold" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica,Arial">90</text>
<text x="690.0" y="588" font-size="36" fill="#f5f5f5" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">you drive 90</text>
<path d="M 1020 470 L 580.0 520" stroke="#2e7d32" stroke-width="5" fill="none" marker-end="none"/>
</svg>