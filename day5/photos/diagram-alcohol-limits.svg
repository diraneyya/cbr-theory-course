<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#1a1a1a"/>
<text x="640.0" y="64" font-size="42" fill="#f5f5f5" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">Alcohol — two limits, and one of them is yours</text>
<line x1="640.0" y1="110" x2="640.0" y2="620" stroke="#444" stroke-width="3"/>
<text x="320" y="170" font-size="32" fill="#f5f5f5" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">experienced driver</text>
<text x="320" y="208" font-size="24" fill="#aaaaaa" text-anchor="middle" font-family="Helvetica,Arial">licence 5 years or more</text>
<circle cx="320" cy="360" r="105" fill="#262626" stroke="#e0a800" stroke-width="8"/>
<text x="320" y="350" font-size="60" fill="#f5f5f5" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">0.5‰</text>
<text x="320" y="400" font-size="24" fill="#aaaaaa" text-anchor="middle" font-family="Helvetica,Arial">blood alcohol</text>
<text x="960" y="170" font-size="32" fill="#ffb454" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">novice driver — YOU</text>
<text x="960" y="208" font-size="24" fill="#aaaaaa" text-anchor="middle" font-family="Helvetica,Arial">first 5 years of the licence</text>
<circle cx="960" cy="360" r="105" fill="#262626" stroke="#c1121f" stroke-width="8"/>
<text x="960" y="350" font-size="60" fill="#f5f5f5" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">0.2‰</text>
<text x="960" y="400" font-size="24" fill="#aaaaaa" text-anchor="middle" font-family="Helvetica,Arial">≈ less than ONE drink</text>
<text x="640.0" y="580" font-size="28" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">A fresh Dutch licence makes you a novice — whatever your experience abroad.</text>
<text x="640.0" y="620" font-size="28" fill="#ffb454" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">The practical rule: if you drive, zero.</text>
</svg>