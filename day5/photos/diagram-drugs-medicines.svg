<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#1a1a1a"/>
<text x="640.0" y="64" font-size="42" fill="#f5f5f5" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">Drugs: zero tolerance — medicines: read the sticker</text>
<rect x="120" y="130" width="460" height="420" rx="18" fill="#262626" stroke="#c1121f" stroke-width="3"/>
<text x="350" y="190" font-size="32" fill="#ff8a8a" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">illegal drugs</text>
<text x="350" y="280" font-size="72" fill="#c1121f" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">0</text>
<text x="350" y="350" font-size="26" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">zero-tolerance limits</text>
<text x="350" y="390" font-size="26" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">checked by saliva test</text>
<text x="350" y="460" font-size="24" fill="#aaaaaa" text-anchor="middle" font-family="Helvetica,Arial">cannabis, cocaine, XTC, speed…</text>
<text x="350" y="496" font-size="24" fill="#aaaaaa" text-anchor="middle" font-family="Helvetica,Arial">any measurable amount = offence</text>
<rect x="700" y="130" width="460" height="420" rx="18" fill="#262626" stroke="#e0a800" stroke-width="3"/>
<text x="930" y="190" font-size="32" fill="#ffd54f" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">medicines</text>
<rect x="790" y="230" width="280" height="160" rx="10" fill="#f5f5f5"/>
<rect x="790" y="330" width="280" height="60" rx="0" fill="#ffd54f"/>
<text x="930" y="368" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">⚠ kan het reactievermogen</text>
<text x="930" y="270" font-size="26" fill="#1a1a1a" text-anchor="middle" font-family="Helvetica,Arial">medicijn</text>
<text x="930" y="450" font-size="26" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">yellow sticker = may affect</text>
<text x="930" y="486" font-size="26" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">your driving — ask before driving</text>
<text x="640.0" y="620" font-size="28" fill="#aaaaaa" text-anchor="middle" font-family="Helvetica,Arial">Tired counts too: exhaustion impairs like alcohol — recognise it and stop.</text>
</svg>