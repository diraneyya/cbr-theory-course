<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#1a1a1a"/>
<text x="640.0" y="64" font-size="42" fill="#f5f5f5" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">The phone rule — it is about your HANDS</text>
<line x1="640.0" y1="110" x2="640.0" y2="620" stroke="#444" stroke-width="3"/>
<text x="320" y="160" font-size="34" fill="#ff8a8a" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">in your hand</text>
<rect x="255" y="210" width="130" height="230" rx="20" fill="#333" stroke="#ff8a8a" stroke-width="5"/>
<rect x="270" y="240" width="100" height="150" rx="4" fill="#4d9de0" opacity="0.5"/>
<line x1="230" y1="200" x2="410" y2="450" stroke="#c1121f" stroke-width="14" stroke-linecap="round"/>
<line x1="410" y1="200" x2="230" y2="450" stroke="#c1121f" stroke-width="14" stroke-linecap="round"/>
<text x="320" y="510" font-size="28" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">forbidden while driving —</text>
<text x="320" y="546" font-size="28" fill="#f5f5f5" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">ALSO waiting at a red light</text>
<text x="960" y="160" font-size="34" fill="#7bc96f" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">in a cradle / hands-free</text>
<rect x="895" y="210" width="130" height="230" rx="20" fill="#333" stroke="#7bc96f" stroke-width="5"/>
<rect x="910" y="240" width="100" height="150" rx="4" fill="#4d9de0" opacity="0.5"/>
<rect x="870" y="430" width="180" height="24" rx="8" fill="#7bc96f"/>
<text x="960" y="510" font-size="28" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">allowed — mounted,</text>
<text x="960" y="546" font-size="28" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">operated hands-free</text>
<text x="640.0" y="640" font-size="28" fill="#ffb454" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">Parked with the engine off? Then it is allowed — "driving" includes standing in traffic.</text>
</svg>