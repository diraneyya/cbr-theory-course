<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#1a1a1a"/>
<text x="640.0" y="64" font-size="42" fill="#f5f5f5" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">Two mopeds — read the number plate</text>
<line x1="640.0" y1="100" x2="640.0" y2="660" stroke="#444" stroke-width="3"/>
<text x="320" y="140" font-size="34" fill="#ffb454" text-anchor="middle" font-weight="bold" font-style="italic" font-family="Helvetica,Arial">snorfiets</text>
<rect x="190" y="180" width="260" height="90" rx="12" fill="#1e5fa8" stroke="#f5f5f5" stroke-width="3"/>
<text x="320" y="242" font-size="52" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">D-001-BX</text>
<text x="320" y="350" font-size="30" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">max 25 km/h</text>
<text x="320" y="415" font-size="30" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">rides on the CYCLE PATH</text>
<text x="320" y="480" font-size="30" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">helmet: YES (since 2025)</text>
<text x="960" y="140" font-size="34" fill="#ffb454" text-anchor="middle" font-weight="bold" font-style="italic" font-family="Helvetica,Arial">bromfiets</text>
<rect x="830" y="180" width="260" height="90" rx="12" fill="#f2c230" stroke="#f5f5f5" stroke-width="3"/>
<text x="960" y="242" font-size="52" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">D-001-BX</text>
<text x="960" y="350" font-size="30" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">max 45 km/h</text>
<text x="960" y="415" font-size="30" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">rides on the ROAD in town</text>
<text x="960" y="480" font-size="30" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">helmet: YES (always)</text>
<text x="320" y="560" font-size="26" fill="#aaaaaa" text-anchor="middle" font-family="Helvetica,Arial">blue plate = slow = with the bikes</text>
<text x="960" y="560" font-size="26" fill="#aaaaaa" text-anchor="middle" font-family="Helvetica,Arial">yellow plate = faster = with the cars</text>
</svg>