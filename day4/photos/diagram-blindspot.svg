<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#1a1a1a"/>
<text x="640.0" y="60" font-size="40" fill="#f5f5f5" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">The dode hoek — where the truck driver cannot see you</text>
<rect x="840" y="250" width="180" height="130" fill="#c1121f" opacity="0.4"/>
<rect x="370" y="388" width="630" height="200" fill="#c1121f" opacity="0.4"/>
<rect x="90" y="240" width="230" height="150" fill="#c1121f" opacity="0.4"/>
<rect x="370" y="198" width="460" height="44" fill="#c1121f" opacity="0.2"/>
<rect x="330" y="244" width="380" height="142" rx="10" fill="#adb5bd"/>
<rect x="720" y="250" width="120" height="130" rx="14" fill="#8d99ae"/>
<text x="520.0" y="327.0" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">TRUCK</text>
<text x="930" y="230" font-size="26" fill="#ff8a8a" text-anchor="middle" font-family="Helvetica,Arial">right in front</text>
<text x="600.0" y="500" font-size="32" fill="#ffdddd" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">the whole RIGHT side — worst of all</text>
<text x="205" y="440" font-size="26" fill="#ff8a8a" text-anchor="middle" font-family="Helvetica,Arial">directly behind</text>
<text x="520.0" y="178" font-size="24" fill="#cc7a7a" text-anchor="middle" font-family="Helvetica,Arial">left side: narrow blind strip</text>
<text x="640.0" y="655" font-size="30" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">If you cannot see the driver in his mirror, he cannot see you</text>
</svg>