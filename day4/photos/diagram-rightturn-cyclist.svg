<rect x="605" y="580" width="60" height="100" rx="12" fill="#4d9de0"/>
<path d="M 635 560 L 635 460 Q 635 410 685 410 L 920 410" stroke="#4d9de0" stroke-width="8" fill="none" stroke-dasharray="14 10"/>
