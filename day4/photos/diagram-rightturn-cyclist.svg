<text x="255" y="168" font-size="26" fill="#f5f5f5" text-anchor="middle" font-family="Helvetica,Arial">same road, same direction:</text>
<text x="255" y="206" font-size="26" fill="#ffb454" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">straight beats turning</text>
