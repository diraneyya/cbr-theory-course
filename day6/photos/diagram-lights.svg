<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#1a1a1a"/>
<text x="640.0" y="60" font-size="40" fill="#f5f5f5" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">Lights — the numbers the exam wants</text>
<rect x="120" y="150" width="1040" height="100" rx="14" fill="#262626" stroke="#4d9de0" stroke-width="3"/>
<text x="160" y="210" font-size="30" fill="#4d9de0" font-weight="bold" font-family="Helvetica,Arial">dipped beam</text>
<text x="480" y="210" font-size="27" fill="#f5f5f5" font-family="Helvetica,Arial">dark, tunnels, rain, poor visibility — the default</text>
<rect x="120" y="272" width="1040" height="100" rx="14" fill="#262626" stroke="#e0a800" stroke-width="3"/>
<text x="160" y="332" font-size="30" fill="#e0a800" font-weight="bold" font-family="Helvetica,Arial">high beam</text>
<text x="480" y="332" font-size="27" fill="#f5f5f5" font-family="Helvetica,Arial">never against oncoming traffic, never close behind another car</text>
<rect x="120" y="394" width="1040" height="100" rx="14" fill="#262626" stroke="#c1121f" stroke-width="3"/>
<text x="160" y="454" font-size="30" fill="#c1121f" font-weight="bold" font-family="Helvetica,Arial">REAR fog light</text>
<text x="480" y="454" font-size="27" fill="#f5f5f5" font-family="Helvetica,Arial">ONLY when visibility is under 50 metres</text>
<rect x="120" y="516" width="1040" height="100" rx="14" fill="#262626" stroke="#c89bf0" stroke-width="3"/>
<text x="160" y="576" font-size="30" fill="#c89bf0" font-weight="bold" font-family="Helvetica,Arial">front fog lights</text>
<text x="480" y="576" font-size="27" fill="#f5f5f5" font-family="Helvetica,Arial">fog, snow or rain that seriously cuts visibility</text>
<text x="640.0" y="675" font-size="28" fill="#ffb454" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial">Rear fog above 50 m visibility is an offence — it blinds the driver behind you.</text>
</svg>